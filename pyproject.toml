[tool.poetry]
name = "cabreira"
version = "0.1.0"
description = "Uma interface humanizada para enxergar o impacto das secas no nordeste brasileiro."
authors = ["Julio Silva <juliocmdsilva@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
